<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atmos | Weather Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <aside class="sidebar">

        <div class="logo">

            <h1>Atmos</h1>

            <p>Live Weather Dashboard</p>

        </div>

        <div class="menu">

                <div class="menu-header">
                        <h3> Popular Searches </h3>
                    <button id="clearhistory">Clear </button>
                </div>

            <ul id="historyList">

            </ul>
        </div>
        

        <div class="status">

            <p>System Status</p>

            <div class="online">

                <span class="circle"></span>

                <span>Ready</span>

            </div>

        </div>

    </aside>

    <main class="main">

        <header>

            <div>

                <h2 id="currentDay">Monday</h2>

                <p id="currentDate">20 July 2026</p>

            </div>

            <div class="search">

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Search city..."
                >

                <button id="searchBtn">

                    Search

                </button>

            </div>

        </header>

        <section class="hero">

            <div class="temperature-card">

                <div>

                    <h1 id="temp">

                        --°

                    </h1>

                    <h3 id="cityName">

                        Search a city

                    </h3>

                    <p id="description">

                        Weather information will appear here.

                    </p>

                </div>

                <div>

                    <img
                        id="weatherIcon"
                        src="https://openweathermap.org/img/wn/01d@2x.png"
                        alt="Weather Icon"
                    >

                </div>

            </div>

            <div class="details">

                <div class="card">

                    <h4>Humidity</h4>

                    <p id="humidity">--%</p>

                </div>

                <div class="card">

                    <h4>Wind</h4>

                    <p id="wind">-- km/h</p>

                </div>

                <div class="card">

                    <h4>Pressure</h4>

                    <p id="pressure">-- hPa</p>

                </div>

                <div class="card">

                    <h4>Feels Like</h4>

                    <p id="feelsLike">--°</p>

                </div>

            </div>

        </section>

    </main>

</div>

<script src="api.js"></script>

<script src="script.js"></script>

</body>
</html>
